logLevel: info

authMethod: http
authHTTPAddress: http://host.docker.internal:8000/live/ingest/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  # Leitura já é sempre pública em AuthorizeMediaServerAction — chamar o hook aqui só
  # cria round-trip redundante e, no servidor de dev single-threaded, um deadlock
  # quando algo já está ocupando a única thread do Laravel esperando o mediamtx.
  - action: read
  - action: playback

api: yes
apiAddress: :9997

rtsp: no
webrtc: no
srt: no

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

paths:
  live:
    runOnOnline: |
      wget -q -O- --header="Content-Type: application/json" --header="X-Live-Webhook-Secret: $LIVE_WEBHOOK_SECRET" --post-data="{\"event\":\"online\",\"path\":\"$MTX_PATH\"}" http://host.docker.internal:8000/live/ingest/webhook
    runOnOffline: |
      wget -q -O- --header="Content-Type: application/json" --header="X-Live-Webhook-Secret: $LIVE_WEBHOOK_SECRET" --post-data="{\"event\":\"offline\",\"path\":\"$MTX_PATH\"}" http://host.docker.internal:8000/live/ingest/webhook
